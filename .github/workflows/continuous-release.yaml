name: Continuous Release

on: push

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24', '26']
    name: verify using node v${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: bash .github/workflows/set-up-ci.sh
      - run: npm ci
      - run: npm run verify
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage (node v${{ matrix.node }})
          path: coverage/
      # Type-checking no longer emits, so build here to catch diagnostics that only
      # surface during declaration emit (e.g. private names in exported API).
      - run: npm run build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    name: publish package if needed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: bash .github/workflows/set-up-ci.sh
      - run: npm ci
      # semantic-release is intentionally not a devDependency — it is a large tree that
      # every `npm ci` would pay for while only this job ever runs it. Pin the major here
      # so the release step stays reproducible.
      - run: npx --yes semantic-release@25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
