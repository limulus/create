name: Continuous Release

on: push

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24', '26']
    name: verify using node v${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: bash .github/workflows/set-up-ci.sh
      - run: npm ci
      - run: npm run verify
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage (node v${{ matrix.node }})
          path: coverage/
      # Type-checking no longer emits, so build here to catch diagnostics that only
      # surface during declaration emit (e.g. private names in exported API).
      - run: npm run build
      # Nothing above runs a generated project's toolchain. This packs the tool as it would
      # publish, generates every template variant from the tarball, and runs each one's
      # verify and build. It stays out of `npm run verify`: it needs the network and takes a
      # minute or more, and the generated projects install the newest versions in their
      # ranges, so it can fail without a change here.
      - run: npm run test:skel

  publish:
    needs: verify
    runs-on: ubuntu-latest
    name: publish package if needed
    # npm's trusted publishing authenticates this job through OIDC, so it holds no npm
    # token. The trusted publisher for @limulus/create on npmjs.com must name this workflow
    # file, `continuous-release.yaml`. `@semantic-release/npm` attempts the OIDC exchange
    # only when `publishConfig.registry` is exactly `https://registry.npmjs.org/`, so keep
    # its trailing slash.
    permissions:
      contents: write # the tag and the GitHub release
      issues: write # comments on the issues a release resolves
      pull-requests: write # comments on the pull requests a release includes
      id-token: write # the OIDC token npm exchanges for a publish token
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: bash .github/workflows/set-up-ci.sh
      - run: npm ci
      # semantic-release is intentionally not a devDependency — it is a large tree that
      # every `npm ci` would pay for while only this job ever runs it. Pin the majors here
      # so the release step stays reproducible. semantic-release does not bundle the
      # conventionalcommits preset that `.releaserc.json` names (the default angular preset
      # cannot parse `feat!:` headers), so it is installed beside it in the same `npx` call.
      - run: npx --yes -p semantic-release@25 -p conventional-changelog-conventionalcommits@9 semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
